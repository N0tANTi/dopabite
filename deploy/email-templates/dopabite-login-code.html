<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>DopaBite 登录验证码</title>
  </head>
  <body style="margin:0;padding:0;background-color:#fff7f4;color:#312832;font-family:'Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">
      你的 DopaBite 登录验证码为 {{code}}，5 分钟内有效。
    </div>

    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background-color:#fff7f4;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:560px;">
            <tr>
              <td style="padding:0 0 16px 4px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td width="44" height="44" align="center" valign="middle" style="width:44px;height:44px;border:2px solid #312832;border-radius:12px;background-color:#ffd43b;font-size:22px;font-weight:800;line-height:44px;color:#312832;">
                      D
                    </td>
                    <td style="padding-left:12px;font-size:23px;font-weight:800;line-height:1.2;color:#312832;">
                      Dopa<span style="color:#ef2a6a;">Bite</span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td style="border:2px solid #312832;border-radius:16px;background-color:#ffffff;padding:36px 34px 32px;">
                <p style="margin:0 0 12px;font-size:13px;font-weight:700;line-height:1.5;color:#ef2a6a;letter-spacing:1px;">
                  安全验证码
                </p>
                <h1 style="margin:0 0 14px;font-size:30px;font-weight:800;line-height:1.3;color:#312832;">
                  登录 DopaBite
                </h1>
                <p style="margin:0 0 26px;font-size:16px;line-height:1.8;color:#625963;">
                  你正在登录或绑定 DopaBite 账号。请在页面中输入下面的验证码。
                </p>

                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;">
                  <tr>
                    <td align="center" style="border:2px solid #312832;border-radius:14px;background-color:#ffd43b;padding:20px 12px;font-family:Consolas,'Courier New',monospace;font-size:38px;font-weight:800;line-height:1.2;letter-spacing:8px;color:#312832;">
                      {{code}}
                    </td>
                  </tr>
                </table>

                <p style="margin:14px 0 28px;text-align:center;font-size:14px;font-weight:700;line-height:1.6;color:#625963;">
                  验证码 5 分钟内有效
                </p>

                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;">
                  <tr>
                    <td style="border-left:4px solid #ef2a6a;border-radius:8px;background-color:#fff0f5;padding:14px 16px;font-size:14px;line-height:1.75;color:#625963;">
                      如果不是你本人操作，请忽略这封邮件。请勿将验证码告诉任何人。
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td align="center" style="padding:20px 18px 0;font-size:12px;line-height:1.8;color:#817681;">
                这是一封系统邮件，请勿直接回复。<br>
                <a href="https://food.archein.site/" style="color:#625963;text-decoration:underline;">food.archein.site</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
